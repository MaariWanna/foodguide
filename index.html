<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taxi</title>
<style>
:root{--bg:#f6f1e3;--ink:#241d08;--muted:#6b6247;--card:#fffdf5;--line:#e3d9b8;--accent:#a87b00;--on-accent:#fff;--head:#d9a81e;--head-ink:#2a2000;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140a;--ink:#f1ead2;--muted:#b3a984;--card:#211d0f;--line:#3a3319;--accent:#f0c44a;--on-accent:#241d08}}
:root[data-theme="dark"]{--bg:#17140a;--ink:#f1ead2;--muted:#b3a984;--card:#211d0f;--line:#3a3319;--accent:#f0c44a;--on-accent:#241d08}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
header{background:var(--head);color:var(--head-ink);border-radius:24px;padding:24px 20px;display:flex;align-items:center;gap:16px;margin-bottom:20px}
header svg{width:64px;height:64px;flex:none}
h1{font-family:Georgia,"Times New Roman",serif;font-size:2rem;margin:0;font-weight:600}
header p{margin:2px 0 0;font-size:.95rem;opacity:.85}
.list{display:grid;gap:12px}
.r{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.r h2{font-size:1.15rem;margin:0 0 12px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;text-align:center;text-decoration:none;padding:14px 8px;border-radius:12px;font-weight:600;font-size:1rem}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ios{background:var(--accent);color:var(--on-accent)}
.and{border:2px solid var(--accent);color:var(--accent)}
.web{grid-column:1/-1;border:2px solid var(--line);color:var(--ink)}
.btn.off{opacity:.4;pointer-events:none}
.note{color:var(--muted);font-size:.85rem;margin:10px 0 0}
</style>
</head>
<body>
<main>
<header>
  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 38l5-14a4 4 0 0 1 4-3h26a4 4 0 0 1 4 3l5 14v10H10V38zM10 38h44M16 48v6M48 48v6M22 30h20"/><circle cx="20" cy="43" r="1.5"/><circle cx="44" cy="43" r="1.5"/></svg>
  <div><h1>Taxi</h1><p>Zgjidh aplikacionin dhe instaloje</p></div>
</header>
<div class="list" id="list"></div>
</main>
<script>
/* ====== APLIKACIONET ======
   ios / android = linku i instalimit, web = faqja (opsionale), note = shënim (opsionale).
   Lëre '' nëse s'ka link — butoni del i zbehtë. */
const TAXI = [
  { emri: "Uber", ios: "https://apps.apple.com/app/uber/id368677368", android: "https://play.google.com/store/apps/details?id=com.ubercab", note: "Kërkon iOS 15.0+ ose Android 8.0+" },
  { emri: "Careem", ios: "https://apps.apple.com/app/careem/id592978487", android: "https://play.google.com/store/apps/details?id=com.careem.acma", web: "https://www.careem.com" },
  { emri: "Bolt", ios: "https://apps.apple.com/app/bolt/id675033630", android: "https://play.google.com/store/apps/details?id=ee.mtakso.client" },
  { emri: "Jeeny", ios: "https://apps.apple.com/app/jeeny/id1456609782", android: "https://play.google.com/store/apps/details?id=me.com.easytaxista" },
  { emri: "Kaiian", ios: "https://apps.apple.com/app/kaiian/id1578823452", android: "https://play.google.com/store/apps/details?id=com.kaiian.app" },
  { emri: "inDrive", ios: "https://apps.apple.com/app/indrive/id780125801", android: "https://play.google.com/store/apps/details?id=sinet.startup.inDriver" }
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link = (url, cls, txt) => url
  ? `<a class="btn ${cls}" href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>`
  : `<span class="btn ${cls} off">${txt}</span>`;
document.getElementById('list').innerHTML = TAXI.map(t =>
  `<div class="r"><h2>${esc(t.emri)}</h2><div class="row">${link(t.ios,'ios','iPhone')}${link(t.android,'and','Android')}${t.web ? link(t.web,'web','Faqja e internetit') : ''}</div>${t.note ? `<p class="note">${esc(t.note)}</p>` : ''}</div>`
).join('');
</script>
</body>
</html>
